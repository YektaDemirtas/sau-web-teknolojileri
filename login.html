<main class="container mt-5">
  <h1>Login</h1>
  <p>Kullanıcı adı öğrenci maili, şifre ise öğrenci numarası olmalıdır.</p>

  <form action="php/login.php" method="POST" onsubmit="return validateLogin()" novalidate>
    <div class="mb-3">
      <label class="form-label">E-posta</label>
      <input type="text" name="email" id="loginEmail" class="form-control" placeholder="b123456789@sakarya.edu.tr">
    </div>

    <div class="mb-3">
      <label class="form-label">Şifre</label>
      <input type="password" name="password" id="loginPassword" class="form-control" placeholder="b123456789">
    </div>

    <div id="loginError" class="error mb-3"></div>

    <button type="submit" class="btn btn-primary">Giriş Yap</button>
  </form>
</main>
