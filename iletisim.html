<main class="container mt-5" id="contactApp">
  <h1>İletişim</h1>

  <form id="contactForm" action="php/form.php" method="POST" novalidate>
    <div class="mb-3">
      <label class="form-label">Ad Soyad</label>
      <input type="text" name="name" id="name" v-model="form.name" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">E-posta</label>
      <input type="text" name="email" id="email" v-model="form.email" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Telefon</label>
      <input type="text" name="phone" id="phone" v-model="form.phone" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Cinsiyet</label><br>
      <input type="radio" name="gender" value="Kadın" v-model="form.gender"> Kadın
      <input type="radio" name="gender" value="Erkek" v-model="form.gender"> Erkek
      <input type="radio" name="gender" value="Belirtmek istemiyorum" v-model="form.gender"> Belirtmek istemiyorum
    </div>

    <div class="mb-3">
      <label class="form-label">Konu</label>
      <select name="subject" id="subject" v-model="form.subject" class="form-select">
        <option value="">Seçiniz</option>
        <option value="Genel">Genel</option>
        <option value="Öneri">Öneri</option>
        <option value="Şikayet">Şikayet</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">İlgi Alanları</label><br>
      <input type="checkbox" name="interests[]" value="Yazılım"> Yazılım
      <input type="checkbox" name="interests[]" value="Spor"> Spor
      <input type="checkbox" name="interests[]" value="Müzik"> Müzik
    </div>

    <div class="mb-3">
      <label class="form-label">Mesaj</label>
      <textarea name="message" id="message" v-model="form.message" class="form-control"></textarea>
    </div>

    <div id="nativeErrors" class="error mb-3"></div>
    <div class="error mb-3">{{ vueError }}</div>

    <button type="button" class="btn btn-warning" onclick="validateNative()">Native JS ile Kontrol Et</button>
    <button type="button" class="btn btn-info" @click="validateVue">Vue ile Kontrol Et</button>
    <button type="submit" class="btn btn-success">Gönder</button>
    <button type="reset" class="btn btn-secondary">Temizle</button>
  </form>
</main>

<footer>
  <p>Web Teknolojileri Proje Ödevi</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</body>
